version: '3.8'

services:
  torbox-cached-addon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torbox-cached-addon
    restart: unless-stopped
    ports:
      - "7070:7000"
    environment:
      - PORT=7000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:7000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
